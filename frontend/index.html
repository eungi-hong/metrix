<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Every unusual daily stock move, explained with cited news and SEC filings." />
    <title>Metrix: why stocks moved</title>
    <script>
      // Apply a saved theme before the first paint, so dark mode never flashes light.
      try { var t = JSON.parse(localStorage.getItem("metrix-theme") || '"system"'); if (t !== "system") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
