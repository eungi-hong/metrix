# Smoke-tests the live API (scripts/smoke.py): health, a pre-warmed ticker with
# news, the anonymous plan refusing a cold ticker, the symbol directory refusing
# an unknown one, one chat turn with the demo key, and CORS for the frontend.
# It makes at most one paid call (the chat turn, skipped without the key).
#
# Run by hand only (Actions > Smoke > Run workflow). It must never run on push:
# Railway's "Wait for CI" waits on every workflow that runs on push, and this
# one tests the deploy rather than gating it.
name: Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METRIX_URL: ${{ secrets.METRIX_URL }}
      METRIX_API_KEY: ${{ secrets.METRIX_DEMO_KEY }}
      METRIX_FRONTEND_ORIGIN: ${{ vars.METRIX_FRONTEND_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/smoke.py
