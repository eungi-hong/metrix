services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metrix
      POSTGRES_PASSWORD: metrix
      POSTGRES_DB: metrix
    ports:
      # 5433 on the host so this does not collide with a Postgres you may
      # already be running locally. Inside the network it is still 5432.
      - "5433:5432"
    volumes:
      - metrix_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, so it never races the database on a cold start.
      test: ["CMD-SHELL", "pg_isready -U metrix -d metrix"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # Limits only: per-user quotas and provider rate limits. Nothing durable
    # lives here (the queue and the spend ledger are in Postgres), so no
    # persistence, and a size cap with eviction instead of failing writes.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      # 6380 on the host, like Postgres on 5433, to stay clear of a local Redis.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    # Keys and tuning come from .env; DATABASE_URL below wins over the one in
    # that file, so the same .env works on the host and in compose.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metrix:metrix@db:5432/metrix
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Started first, but the API runs without it: limits fall back to
      # per-process counters while Redis is unreachable.
      redis:
        condition: service_started
    healthcheck:
      # The worker waits for this, which also means it waits for migrations:
      # the API container applies them before it starts serving.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metrix:metrix@db:5432/metrix
      REDIS_URL: redis://redis:6379/0
      # The API container migrates; two containers racing `alembic upgrade`
      # would fail one of them.
      SKIP_MIGRATIONS: "1"
    depends_on:
      api:
        condition: service_healthy
    # Longer than WORKER_SHUTDOWN_TIMEOUT_SECONDS (30s), so SIGTERM gets a
    # graceful drain before Docker resorts to SIGKILL.
    stop_grace_period: 45s

volumes:
  metrix_pgdata:
